<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu PC Virtual</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
}

.desktop {
  height: 100vh;
  padding: 25px;
  padding-bottom: 65px;
  color: white;
  background: linear-gradient(135deg, #123c69, #1e90ff, #111827);
}

.icon {
  display: block;
  width: 90px;
  padding: 12px 5px;
  margin-bottom: 12px;
  color: white;
  text-align: center;
  cursor: pointer;
  border: 0;
  background: transparent;
}

.icon:hover {
  background: #ffffff33;
  border-radius: 8px;
}

.icon span {
  display: block;
  font-size: 35px;
  margin-bottom: 8px;
}

.taskbar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 55px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 10px 18px;
  background: #101010dd;
  color: white;
}

button {
  cursor: pointer;
}

.start {
  padding: 10px 18px;
  color: white;
  background: #1685ff;
  border: none;
  border-radius: 6px;
}

.window {
  position: absolute;
  top: 18%;
  left: 20%;
  width: min(500px, 90%);
  background: white;
  color: #222;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 10px 40px #0008;
}

.window-title {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  background: #1685ff;
  color: white;
}

.window-content {
  padding: 18px;
  min-height: 180px;
}

.close {
  border: none;
  background: transparent;
  color: white;
  font-size: 18px;
}

textarea {
  width: 100%;
  min-height: 130px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>
<div class="desktop">
  <button class="icon" onclick="openApp('Arquivos')">
    <span>📁</span>Arquivos
  </button>

  <button class="icon" onclick="openApp('Bloco de Notas')">
    <span>📝</span>Bloco de Notas
  </button>

  <button class="icon" onclick="openApp('Sobre o PC')">
    <span>💻</span>Meu Computador
  </button>
</div>

<div class="taskbar">
  <button class="start" onclick="openApp('Menu Iniciar')">
    ⊞ Iniciar
  </button>
  <span>Meu PC Virtual</span>
  <span id="clock" style="margin-left:auto"></span>
</div>

<div id="window" class="window hidden">
  <div class="window-title">
    <span id="title">Aplicativo</span>
    <button class="close" onclick="closeApp()">✕</button>
  </div>
  <div id="content" class="window-content"></div>
</div>

<script>
function openApp(app) {
  const win = document.getElementById("window");
  const title = document.getElementById("title");
  const content = document.getElementById("content");

  win.classList.remove("hidden");
  title.textContent = app;

  if (app === "Bloco de Notas") {
    content.innerHTML =
      '<textarea placeholder="Digite seu texto aqui..."></textarea>';
  } else if (app === "Arquivos") {
    content.innerHTML =
      "<h3>📁 Meus Arquivos</h3>" +
      "<p>Este é um gerenciador de arquivos demonstrativo.</p>" +
      "<input type='file' multiple>";
  } else if (app === "Sobre o PC") {
    content.innerHTML =
      "<h3>💻 Meu PC Virtual</h3>" +
      "<p>Sistema: Web OS</p>" +
      "<p>Versão: 1.0</p>" +
      "<p>Ambiente: Navegador</p>";
  } else {
    content.innerHTML =
      "<h3>Bem-vindo!</h3>" +
      "<p>Escolha um aplicativo na área de trabalho.</p>";
  }
}

function closeApp() {
  document.getElementById("window").classList.add("hidden");
}

function updateClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
